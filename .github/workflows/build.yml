name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # real Chromium: toolbar on one row, no cut-off text, light/dark, 1500px and 1100px, every view
      - run: npx electron scripts/uitest.js
      # starts the real app and drives it through the real preload/IPC bridge
      - run: npx electron scripts/e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: ui-shots/*.png
          if-no-files-found: ignore
      # --publish never: electron-builder otherwise tries to publish on tag builds and fails without GH_TOKEN
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Nexo-Ahks-win
          path: dist/*.exe
          if-no-files-found: error
      - name: Attach to the GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
