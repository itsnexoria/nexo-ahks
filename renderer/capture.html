<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Nexo Ahks capture</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:crosshair;user-select:none;font:12px system-ui,Segoe UI,sans-serif}
#shot{position:fixed;left:0;top:0;width:100%;height:100%}
#sel{position:fixed;border:1.5px solid #6f8dff;box-shadow:0 0 0 99999px rgba(0,0,0,.45);display:none;pointer-events:none}
#tip{position:fixed;background:#11141c;color:#eef0ff;border:1px solid #3a4160;border-radius:8px;padding:6px 8px;pointer-events:none;display:none;white-space:nowrap}
#mag{display:none;border:1px solid #fff;image-rendering:pixelated;margin-bottom:4px}
#sw{display:inline-block;width:12px;height:12px;border:1px solid #fff;vertical-align:middle;margin-right:6px}
#help{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:rgba(17,20,28,.92);color:#eef0ff;padding:8px 14px;border-radius:10px;pointer-events:none}
</style></head><body>
<canvas id="shot"></canvas><div id="sel"></div>
<div id="tip"><canvas id="mag" width="121" height="121"></canvas><span id="sw"></span><span id="txt"></span></div>
<div id="help"></div>
<script>
let MODE='region',SCALE=1,cx=null,ready=false,start=null,drag=false,cur={x:0,y:0};
const $=id=>document.getElementById(id),shot=$('shot'),sel=$('sel'),tip=$('tip'),mag=$('mag');
const HELP={region:'Drag a box around the part of the screen you want. Esc cancels.',color:'Move over the color and click. Esc cancels.',point:'Click the spot you want. Esc cancels.'};
// css px -> screenshot px
const toImg=(x,y)=>({x:Math.round(x*SCALE),y:Math.round(y*SCALE)});
const hex=n=>n.toString(16).padStart(2,'0').toUpperCase();
function pix(p){if(!cx)return'';try{const d=cx.getImageData(p.x,p.y,1,1).data;return'0x'+hex(d[0])+hex(d[1])+hex(d[2])}catch(e){return''}}
function init(d){MODE=d.mode||'region';SCALE=d.w/Math.max(1,innerWidth);$('help').textContent=HELP[MODE]||HELP.region;
  try{cx=shot.getContext('2d',{willReadFrequently:true})}catch(e){cx=null}
  if(cx&&d.img){const im=new Image();im.onload=()=>{shot.width=im.naturalWidth;shot.height=im.naturalHeight;cx.drawImage(im,0,0);ready=true};im.src=d.img}else ready=true}
function finish(r){window.cap&&window.cap.done(r)}
function showTip(e){if(MODE==='region'&&!drag){tip.style.display='none';return}const p=toImg(e.clientX,e.clientY),c=pix(p);
  if(MODE==='region'){tip.style.display='block';mag.style.display='none';$('sw').style.display='none';$('txt').textContent=sel.dataset.w?sel.dataset.w+' × '+sel.dataset.h:'';}
  else{tip.style.display='block';$('sw').style.display='inline-block';$('sw').style.background=c.replace('0x','#')||'transparent';$('txt').textContent=p.x+', '+p.y+(c?'  '+c:'');
    if(cx&&MODE==='color'){mag.style.display='block';const m=mag.getContext('2d');m.imageSmoothingEnabled=false;m.clearRect(0,0,121,121);m.drawImage(shot,p.x-5,p.y-5,11,11,0,0,121,121);m.strokeStyle='#fff';m.strokeRect(55,55,11,11)}else mag.style.display='none'}
  tip.style.left=Math.min(e.clientX+18,innerWidth-190)+'px';tip.style.top=Math.min(e.clientY+18,innerHeight-(mag.style.display==='block'?190:50))+'px'}
addEventListener('mousedown',e=>{if(e.button!==0)return;cur={x:e.clientX,y:e.clientY};if(MODE==='region'){start={x:e.clientX,y:e.clientY};drag=true}});
addEventListener('mousemove',e=>{cur={x:e.clientX,y:e.clientY};
  if(MODE==='region'&&drag&&start){const x=Math.min(start.x,e.clientX),y=Math.min(start.y,e.clientY),w=Math.abs(e.clientX-start.x),h=Math.abs(e.clientY-start.y);
    Object.assign(sel.style,{display:'block',left:x+'px',top:y+'px',width:w+'px',height:h+'px'});const a=toImg(w,h);sel.dataset.w=a.x;sel.dataset.h=a.y}
  showTip(e)});
addEventListener('mouseup',e=>{if(e.button!==0)return;
  if(MODE==='region'){if(!drag||!start)return;drag=false;const a=toImg(Math.min(start.x,e.clientX),Math.min(start.y,e.clientY)),b=toImg(Math.abs(e.clientX-start.x),Math.abs(e.clientY-start.y));start=null;sel.style.display='none';
    if(b.x<4||b.y<4)return;finish({x:a.x,y:a.y,w:b.x,h:b.y})}
  else{const p=toImg(e.clientX,e.clientY);finish({x:p.x,y:p.y,c:pix(p)})}});
addEventListener('keydown',e=>{if(e.key==='Escape')finish(null)});
addEventListener('contextmenu',e=>{e.preventDefault();finish(null)});
window.__cap={init};
if(window.cap&&window.cap.onInit)window.cap.onInit(init);
</script></body></html>
